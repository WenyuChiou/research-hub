# v0.95.0 W9 (G5 #19): automated dependency + Action update PRs.
# Complements the pip-audit CI step — dependabot opens the PR, the
# CI matrix (3.10–3.14 × 3 OS) + pytest gate it before merge.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # Group related test-tool updates before the broader patch group.
    # These groups apply only to version updates; security updates stay separate.
    groups:
      test-tooling:
        applies-to: version-updates
        patterns:
          - "pytest-cov"
          - "pytest-mock"
          - "pytest-socket"
          - "pytest-split"
          - "pytest-timeout"
          - "responses"
        update-types: ["minor", "patch"]
      runtime-patches:
        update-types: ["patch"]
    ignore:
      # notebooklm-py is capped <0.5.0 ON PURPOSE (see pyproject.toml): a 0.x
      # minor-version kwarg drift shipped v0.88.10 "100% NLM upload broken".
      # Don't auto-widen the cap (PR #119 -> 0.6.0 failed the full CI matrix) —
      # raise it manually after validating a specific version + call sites.
      # Patch updates within 0.4.x still flow.
      - dependency-name: "notebooklm-py"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    labels:
      - "ci"
