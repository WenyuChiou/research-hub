name: CI

on:
  push:
    branches:
      - master
      - 'verify/**'
  pull_request:
    # All bases; edited includes retargeting. Every edit runs real checks.
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  # Only ordinary PR runs supersede each other. Integration pushes and PR
  # edits get unique groups, so they cannot cancel running OR pending checks.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.action != 'edited' && format('pr-{0}', github.event.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' }}

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.route.outputs.scope }}
      run_docs_skills_linux: ${{ steps.route.outputs.run_docs_skills_linux }}
      run_docs_skills_windows: ${{ steps.route.outputs.run_docs_skills_windows }}
      run_workspace: ${{ steps.route.outputs.run_workspace }}
      run_python_tests: ${{ steps.route.outputs.run_python_tests }}
      run_full_os_matrix: ${{ steps.route.outputs.run_full_os_matrix }}
      run_stress: ${{ steps.route.outputs.run_stress }}
      run_audit: ${{ steps.route.outputs.run_audit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify checkout identity
        run: python3 scripts/check_ci_checkout.py
      - name: Classify changed paths
        id: route
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}" >/dev/null 2>&1 || true
          fi
          python3 scripts/classify_ci_changes.py --github-output "$GITHUB_OUTPUT"

  docs-and-skills:
    name: docs and skills contracts (ubuntu-latest, py3.12)
    needs: classify
    if: needs.classify.outputs.run_docs_skills_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml
      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py
      - name: Install dependencies
        run: pip install -e '.[dev,mcp]'
      - name: Run docs and skill contract suites
        run: |
          pytest -q \
            tests/test_readme_entry_paths.py \
            tests/test_v089_readme_machine_parseable.py \
            tests/test_workspace_docs.py \
            tests/test_workspace_producer_integration.py \
            tests/test_summary_doc_contract.py \
            tests/test_skills_data_parity.py \
            tests/test_skill_structure.py \
            tests/test_frontmatter_schema.py \
            tests/test_v066_skill_schema.py \
            tests/test_v066_research_workspace_docs.py \
            tests/test_v068_3_version_sync.py \
            tests/test_stage1_native_handoff_guidance.py \
            tests/test_fulltext_summary_guidance.py \
            tests/test_summarize_prompt_only.py \
            tests/test_selected_hub_handoff_contract.py \
            tests/test_research_process_receipts.py \
            tests/test_source_claim_guidance.py \
            tests/test_stage1_budget_guidance.py \
            tests/test_stage1_eval_contract.py \
            tests/test_native_skill_schema_resource.py \
            tests/test_native_reader.py \
            tests/test_v089_describe.py \
            tests/test_ci_routing.py

  docs-and-skills-windows:
    name: docs and skills contracts (windows-latest, py3.12)
    needs: classify
    if: needs.classify.outputs.run_docs_skills_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml
      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py
      - name: Install dependencies
        run: pip install -e '.[dev,mcp]'
      - name: Run skill parity and installer suites
        run: |
          pytest -q `
            tests/test_skills_data_parity.py `
            tests/test_skill_structure.py `
            tests/test_frontmatter_schema.py `
            tests/test_v066_skill_schema.py `
            tests/test_v066_research_workspace_docs.py `
            tests/test_v068_3_version_sync.py `
            tests/test_stage1_native_handoff_guidance.py `
            tests/test_fulltext_summary_guidance.py `
            tests/test_summarize_prompt_only.py `
            tests/test_summary_doc_contract.py `
            tests/test_selected_hub_handoff_contract.py `
            tests/test_research_process_receipts.py `
            tests/test_source_claim_guidance.py `
            tests/test_stage1_budget_guidance.py `
            tests/test_stage1_eval_contract.py `
            tests/test_native_skill_schema_resource.py `
            tests/test_native_reader.py `
            tests/test_v089_describe.py `
            tests/test_ci_routing.py

  workspace:
    name: workspace UI, browser and installed wheel
    needs: classify
    if: needs.classify.outputs.run_workspace == 'true'
    # Pinned: on ubuntu-latest = 26.04, playwright 1.58.0 (below) refuses
    # "install chromium" ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml
      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check and build workspace
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Require reproducible bundled assets
        run: |
          test -z "$(git status --porcelain -- src/research_hub/workspace_static)"
      - name: Install test tooling and build wheel
        run: |
          pip install build playwright==1.58.0
          python -m build --wheel --outdir dist/workspace
          python -m venv .wheel-venv
          .wheel-venv/bin/pip install dist/workspace/*.whl 'fastmcp>=2.0'
      - name: Verify clean wheel without Node runtime
        run: .wheel-venv/bin/python scripts/workspace_install_smoke.py --output artifacts/wheel-report.json
      - name: Install workspace browser runtime
        timeout-minutes: 2
        run: pip install -e '.[mcp]'
      - name: Install Chromium OS dependencies
        timeout-minutes: 13
        run: python -m playwright install-deps chromium
      - name: Install Chromium browser
        timeout-minutes: 3
        run: python -m playwright install chromium
      - name: Real Chromium workspace smoke
        timeout-minutes: 3
        run: python scripts/workspace_browser_smoke.py --output artifacts/browser
      - name: Check out immutable public writing producer
        uses: actions/checkout@v7
        with:
          repository: WenyuChiou/academic-writing-skills
          ref: bc15e29e976cd6ade3484aeaa4f1230444697f8a
          path: .writing-adapter
          persist-credentials: false
      - name: Verify pinned producer bundle and offline handoffs
        env:
          RESEARCH_HUB_TEST_WRITING_ADAPTER: ${{ github.workspace }}/.writing-adapter
        run: |
          pip install -e '.[dev,mcp]'
          pytest -q tests/test_workspace_producer_integration.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-verification
          path: artifacts/

  test:
    # Core OS parity for code/full runs (Windows py3.12 with coverage + macOS py3.12).
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: classify
    if: needs.classify.outputs.run_python_tests == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml

      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py

      - name: Install dependencies
        run: pip install -e '.[mcp,dev,playwright,import]'

      - name: Run tests
        if: matrix.os != 'windows-latest'
        run: pytest -q --maxfail=3 -m "not slow"

      - name: Coverage
        if: matrix.os == 'windows-latest'
        run: pytest --cov=research_hub --cov-report=term-missing --cov-fail-under=62 -m "not slow"

  test-extended-os:
    # Extended Windows/macOS Python matrix only when infra/dependencies/verify/** require full coverage.
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: classify
    if: needs.classify.outputs.run_full_os_matrix == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"
            experimental: true
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml

      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py

      - name: Install dependencies
        run: pip install -e '.[mcp,dev,playwright,import]'

      - name: Run tests
        run: pytest -q --maxfail=3 -m "not slow"

  test-ubuntu:
    # Issue #61: ubuntu-latest runners have ~7 GB RAM. Split into 4 shards.
    name: test (ubuntu-latest, py${{ matrix.python-version }}, shard ${{ matrix.split_index }}/4)
    needs: classify
    if: needs.classify.outputs.run_python_tests == 'true'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        split_index: [1, 2, 3, 4]
        include:
          - python-version: "3.14"
            split_index: 1
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml

      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py

      - name: Install dependencies
        run: pip install -e '.[mcp,dev,playwright,import]'

      - name: Run tests (shard ${{ matrix.split_index }}/4)
        run: pytest -q --maxfail=3 -m "not slow" --splits 4 --group ${{ matrix.split_index }}

  dependency-audit:
    # Single CVE scan job per full/infra run (avoids repeating pip-audit across all matrix rows).
    name: dependency CVE audit
    needs: classify
    if: needs.classify.outputs.run_audit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml
      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py
      - name: Install dependencies
        run: pip install -e '.[mcp,dev,playwright,import]'
      - name: Dependency CVE scan (pip-audit)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install pip-audit "setuptools>=84.1.0"
          python -m pip_audit --strict --desc || true
        continue-on-error: true

  stress-tests:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.run_stress == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
            .github/workflows/ci.yml

      - name: Verify checkout identity
        run: python scripts/check_ci_checkout.py

      - name: Install dependencies
        run: pip install -e '.[mcp,dev,playwright,import]'

      - name: Run stress tests
        run: pytest tests/stress/ -v -o "addopts=" -m stress
        timeout-minutes: 10

  skill-version-guard:
    name: skill-version-guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify checkout identity
        run: python3 scripts/check_ci_checkout.py

      - name: Skill-content change requires a plugin version bump
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git fetch --no-tags origin "$base" >/dev/null 2>&1 || true
          merge_base=$(git merge-base "$base" "$head")
          changed=$(git diff --name-only "$merge_base" "$head")
          echo "Merge base: $merge_base"
          echo "Changed files in this PR:"
          echo "$changed"
          if echo "$changed" | grep -qE '^(skills|src/research_hub/skills_data)/'; then
            echo "Skill content changed — a plugin version bump is required."
            read_ver() {
              git show "$1:.claude-plugin/plugin.json" 2>/dev/null \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))" 2>/dev/null \
                || echo ''
            }
            base_ver=$(read_ver "$merge_base")
            head_ver=$(read_ver "$head")
            echo "plugin.json version: base='$base_ver' head='$head_ver'"
            if [ -z "$head_ver" ]; then
              echo "::error::Could not read \"version\" from .claude-plugin/plugin.json on the PR head."
              exit 1
            fi
            if [ "$base_ver" = "$head_ver" ]; then
              echo "::error::This PR changes skill content (skills/ or src/research_hub/skills_data/) but .claude-plugin/plugin.json version is unchanged ('$head_ver'). The marketplace plugin cache is keyed on the version string — an un-bumped change never reaches user installs. Bump the version (see Phase 8.1 / dogfood V1b). Even a non-functional edit needs a bump so the cache invalidates cleanly."
              exit 1
            fi
            echo "OK — skill-content change is paired with a plugin version bump ('$base_ver' -> '$head_ver')."
          else
            echo "No skill-content change in this PR — guard not applicable."
          fi
